<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaceMaster - Track Pacing Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-bg {
            0%, 100% { background-color: #ef4444; }
            50% { background-color: #dc2626; }
        }
        .interval-active-work { animation: pulse-bg 2s infinite; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

    <div class="max-w-md mx-auto px-4 pt-6">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-black tracking-tight text-emerald-400">PaceMaster</h1>
            <p class="text-xs text-slate-400 uppercase tracking-wider mt-1">Track Pacing Engine</p>
        </header>

        <!-- STEP 1: CONFIGURATION -->
        <section class="bg-slate-800 rounded-2xl p-5 shadow-xl mb-6 border border-slate-700">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <span>⏱️</span> Set Target Paces or Race Times
            </h2>
            
            <div class="grid grid-cols-3 gap-3 mb-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 text-center">5K Pace</label>
                    <input type="text" id="pace5k" value="4:35" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-center font-mono font-bold text-emerald-400 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 text-center">10K Pace</label>
                    <input type="text" id="pace10k" value="4:45" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-center font-mono font-bold text-emerald-400 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 text-center">Half Pace</label>
                    <input type="text" id="paceHalf" value="4:55" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-center font-mono font-bold text-emerald-400 focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3 bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 text-center">5K Time</label>
                    <input type="text" id="total5k" value="22:55" class="w-full bg-slate-800 border border-slate-700 rounded-md p-1.5 text-center font-mono font-bold text-amber-400 focus:outline-none focus:border-amber-500 text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 text-center">10K Time</label>
                    <input type="text" id="total10k" value="47:30" class="w-full bg-slate-800 border border-slate-700 rounded-md p-1.5 text-center font-mono font-bold text-amber-400 focus:outline-none focus:border-amber-500 text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 text-center">Half Time</label>
                    <input type="text" id="totalHalf" value="1:43:44" class="w-full bg-slate-800 border border-slate-700 rounded-md p-1.5 text-center font-mono font-bold text-amber-400 focus:outline-none focus:border-amber-500 text-sm">
                </div>
            </div>
        </section>

        <!-- STEP 2: SESSION SELECTION -->
        <section class="bg-slate-800 rounded-2xl p-5 shadow-xl mb-6 border border-slate-700">
            <label class="block text-lg font-bold mb-2" for="sessionSelect">🏃‍♂️ Select Track Session</label>
            <select id="sessionSelect" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 font-medium text-slate-200 focus:outline-none focus:border-emerald-500">
                <option value="pyramid">1. The Double Pyramid (100m-400m)</option>
                <option value="vo2max">2. 5x 1,000m VO2 Max Repeats</option>
                <option value="lactic">3. 10x 400m Lactic Buffer</option>
                <option value="ladder">4. Decrescendo Drop-Ladder</option>
            </select>

            <div class="mt-4 flex items-center justify-between bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                <span class="text-sm text-slate-300 font-medium">Include Warmup & Cooldown</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="includeWarmup" checked class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                </label>
            </div>
            
            <button id="buildWorkoutBtn" class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/20 uppercase tracking-wider text-sm">
                Load & Calculate Splits
            </button>
        </section>

        <!-- GRAPHICAL TIMELINE PROFILE DISPLAY -->
        <section id="chartCard" class="bg-slate-800 rounded-2xl p-4 shadow-xl mb-6 border border-slate-700 hidden">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xs uppercase font-bold text-slate-400 tracking-wider">Session Profile Chart</h3>
                <span class="text-[10px] text-slate-500 font-mono">Y: Dist / X: Time</span>
            </div>
            <div class="bg-slate-950 rounded-xl p-2 border border-slate-800">
                <canvas id="profileCanvas" width="380" height="150" class="w-full h-auto block"></canvas>
            </div>
        </section>

        <!-- STEP 3: LIVE TIMER CONSOLE -->
        <section id="timerConsole" class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden hidden">
            <div id="timerHeader" class="bg-slate-700 px-5 py-4 flex justify-between items-center">
                <span id="currentPhaseLabel" class="font-black uppercase tracking-widest text-sm">WARMUP</span>
                <span id="stepCounter" class="text-xs bg-slate-900/40 px-2.5 py-1 rounded-full font-mono font-bold">Step 1/1</span>
            </div>

            <div class="p-6 text-center">
                <div id="mainCountdown" class="text-7xl font-black font-mono tracking-tighter my-2 text-white">10:00</div>
                
                <!-- Cumulative Workout Timeline Tracking Grid -->
                <div class="grid grid-cols-2 gap-2 max-w-xs mx-auto mb-4 border-t border-b border-slate-700/60 py-2 text-xs font-mono text-slate-400">
                    <div class="text-left">Elapsed: <span id="workoutElapsedDisplay" class="font-bold text-slate-200">00:00</span></div>
                    <div class="text-right">Total: <span id="workoutTotalDisplay" class="font-bold text-slate-200">00:00</span></div>
                </div>

                <div id="targetSplitAlert" class="text-xl font-bold text-amber-400 min-h-[1.75rem] mb-6">Target: Jog Easy</div>

                <div class="w-full bg-slate-900 rounded-full h-2.5 mb-6 overflow-hidden">
                    <div id="progressBar" class="bg-emerald-400 h-2.5 rounded-full transition-all duration-100" style="width: 0%"></div>
                </div>

                <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-700 text-left mb-6">
                    <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider block">Next Up</span>
                    <span id="nextUpLabel" class="text-sm font-semibold text-slate-300">Interval Rep</span>
                </div>

                <!-- Navigation Controls Matrix -->
                <div class="grid grid-cols-3 gap-2">
                    <button id="backBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 px-2 rounded-xl transition duration-150 uppercase tracking-wider text-xs">
                        ⬅ Back
                    </button>
                    <button id="playPauseBtn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-2 rounded-xl shadow-lg transition duration-150 uppercase tracking-wider text-xs">
                        Start
                    </button>
                    <button id="skipBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 px-2 rounded-xl transition duration-150 uppercase tracking-wider text-xs">
                        Skip ➡
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- AUDIO ENGINE (Background Audio Worker Loophole) -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioWakeNode = null;

        function initBackgroundAudioLock() {
            if (audioWakeNode) return;
            try {
                const bufferSize = audioCtx.sampleRate;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                audioWakeNode = audioCtx.createBufferSource();
                audioWakeNode.buffer = buffer;
                audioWakeNode.loop = true;
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.00005; 
                audioWakeNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                audioWakeNode.start();
            } catch(e) {
                console.log("Audio node bypass skipped init setup context.");
            }
        }

        function beep(freq = 600, duration = 0.15, isLoud = false) {
            try {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                
                // Enhanced loudness scaling for countdown indicators
                const volume = isLoud ? 0.35 : 0.08;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log("Audio driver engine update failed.");
            }
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.05;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>

    <!-- CORE UNIX SYNC ENGINE -->
    <script>
        const sessionTemplates = {
            pyramid: {
                name: "Double Pyramid",
                blocks: [
                    { type: 'work', dist: 100, paceRef: '5k', factor: 0.85 },
                    { type: 'rest', dist: 100, isMatch: true },
                    { type: 'work', dist: 200, paceRef: '5k', factor: 0.90 },
                    { type: 'rest', dist: 200, isMatch: true },
                    { type: 'work', dist: 300, paceRef: '5k', factor: 0.95 },
                    { type: 'rest', dist: 300, isMatch: true },
                    { type: 'work', dist: 400, paceRef: '5k', factor: 1.0 },
                    { type: 'rest', dist: 400, isMatch: true },
                    { type: 'work', dist: 300, paceRef: '5k', factor: 0.95 },
                    { type: 'rest', dist: 300, isMatch: true },
                    { type: 'work', dist: 200, paceRef: '5k', factor: 0.90 },
                    { type: 'rest', dist: 200, isMatch: true },
                    { type: 'work', dist: 100, paceRef: '5k', factor: 0.85 },
                    { type: 'rest', dist: 100, isMatch: true, isFinalDown: true }
                ],
                loop: 2
            },
            vo2max: {
                name: "5x 1000m Repeats",
                blocks: [
                    { type: 'work', dist: 1000, paceRef: '5k', factor: 1.0 },
                    { type: 'rest', duration: 120, label: "Standing Recovery", dist: 0 }
                ],
                loop: 5
            },
            lactic: {
                name: "10x 400m Lactic Buffer",
                blocks: [
                    { type: 'work', dist: 400, paceRef: '10k', factor: 0.98 },
                    { type: 'rest', duration: 60, label: "Strict Rest", dist: 0 }
                ],
                loop: 10
            },
            ladder: {
                name: "Decrescendo Drop-Ladder",
                blocks: [
                    { type: 'work', dist: 1600, paceRef: 'Half', factor: 1.0 },
                    { type: 'rest', duration: 180, label: "Full Rest", dist: 0 },
                    { type: 'work', dist: 1200, paceRef: '10k', factor: 1.0 },
                    { type: 'rest', duration: 150, label: "Full Rest", dist: 0 },
                    { type: 'work', dist: 800, paceRef: '5k', factor: 1.0 },
                    { type: 'rest', duration: 120, label: "Full Rest", dist: 0 },
                    { type: 'work', dist: 400, paceRef: '5k', factor: 0.92 }
                ],
                loop: 1
            }
        };

        let timeline = [];
        let activeIndex = 0;
        let totalWorkoutDuration = 0; 
        
        let isRunning = false;
        let currentSegmentDuration = 0;
        let lastReportedSecond = -1; 
        let animationFrameId = null;

        let segmentStartTimeStamp = 0; 
        let pauseRemainingSeconds = 0;

        function parseTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':').map(x => parseInt(x, 10));
            if (parts.some(isNaN)) return 0;
            if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
            if (parts.length === 2) return (parts[0] * 60) + parts[1];
            return 0;
        }

        function formatMMSS(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = Math.round(totalSeconds % 60);
            return m + ":" + (s < 10 ? '0' : '') + s;
        }

        function formatHMS(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = Math.round(totalSeconds % 60);
            if (h > 0) return h + ":" + (m < 10 ? '0' : '') + m + ":" + (s < 10 ? '0' : '') + s;
            return m + ":" + (s < 10 ? '0' : '') + s;
        }

        function syncPaceToTime(distanceKey) {
            const paceStr = document.getElementById("pace" + distanceKey).value;
            const paceSecs = parseTimeToSeconds(paceStr);
            if (!paceSecs) return;
            const timeInput = document.getElementById("total" + distanceKey);
            if (distanceKey === '5k') timeInput.value = formatHMS(paceSecs * 5);
            if (distanceKey === '10k') timeInput.value = formatHMS(paceSecs * 10);
            if (distanceKey === 'Half') timeInput.value = formatHMS(paceSecs * 21.0975);
        }

        function syncTimeToPace(distanceKey) {
            const timeStr = document.getElementById("total" + distanceKey).value;
            const totalSecs = parseTimeToSeconds(timeStr);
            if (!totalSecs) return;
            const paceInput = document.getElementById("pace" + distanceKey);
            if (distanceKey === '5k') paceInput.value = formatMMSS(totalSecs / 5);
            if (distanceKey === '10k') paceInput.value = formatMMSS(totalSecs / 10);
            if (distanceKey === 'Half') paceInput.value = formatMMSS(totalSecs / 21.0975);
        }

        function constructActiveTimeline() {
            const templateKey = document.getElementById('sessionSelect').value;
            const template = sessionTemplates[templateKey];
            const paces = {
                '5k': parseTimeToSeconds(document.getElementById('pace5k').value),
                '10k': parseTimeToSeconds(document.getElementById('pace10k').value),
                'Half': parseTimeToSeconds(document.getElementById('paceHalf').value)
            };

            let generatedTimeline = [];
            totalWorkoutDuration = 0;

            if(document.getElementById('includeWarmup').checked) {
                generatedTimeline.push({ type: 'warmup', label: "Warmup Jog", duration: 600, dist: 1500, info: "Keep it easy" });
                totalWorkoutDuration += 600;
            }

            for (let l = 0; l < template.loop; l++) {
                template.blocks.forEach((block) => {
                    if (block.type === 'work') {
                        const basePace = paces[block.paceRef] * (block.factor || 1.0);
                        const calculatedDuration = Math.round((block.dist / 1000) * basePace);
                        generatedTimeline.push({
                            type: 'work',
                            label: block.dist + "m Hard Rep",
                            duration: calculatedDuration,
                            dist: block.dist,
                            info: "Target: " + formatMMSS(calculatedDuration) + " (" + block.dist + "m split)"
                        });
                        totalWorkoutDuration += calculatedDuration;
                    } else if (block.type === 'rest') {
                        let duration = block.duration;
                        let distance = block.dist !== undefined ? block.dist : 0;
                        if (block.isMatch) {
                            duration = Math.round(block.dist * 0.75);
                            distance = block.dist;
                        }
                        
                        if (templateKey === 'pyramid' && block.isFinalDown && l === 0) {
                            generatedTimeline.push({
                                type: 'rest',
                                label: "100m Final Recovery",
                                duration: duration,
                                dist: distance,
                                info: "Slow jog to finish flight 1"
                            });
                            totalWorkoutDuration += duration;

                            generatedTimeline.push({
                                type: 'rest',
                                label: "5 Min Intermission Break",
                                duration: 300,
                                dist: 0,
                                info: "Full hydration break before Flight 2"
                            });
                            totalWorkoutDuration += 300;
                        } else {
                            generatedTimeline.push({
                                type: 'rest',
                                label: block.label || (block.dist + "m Recovery"),
                                duration: duration,
                                dist: distance,
                                info: "Walk or slow jog"
                            });
                            totalWorkoutDuration += duration;
                        }
                    }
                });
            }

            if(document.getElementById('includeWarmup').checked) {
                generatedTimeline.push({ type: 'cooldown', label: "Cooldown Jog", duration: 600, dist: 1200, info: "Bring heart rate down" });
                totalWorkoutDuration += 600;
            }
            return generatedTimeline;
        }

        // RENDERS GRAPHICAL SCATTER PROFILE LINE (Distance vs. Time)
        function drawWorkoutProfileChart(activeTimeElapsed = 0) {
            const canvas = document.getElementById('profileCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (timeline.length === 0) return;

            // Calculate metrics limits
            let maxCumulativeTime = totalWorkoutDuration;
            let maxCumulativeDist = 0;
            timeline.forEach(step => maxCumulativeDist += step.dist);

            // Canvas Paddings
            const paddingLeft = 35;
            const paddingRight = 15;
            const paddingTop = 15;
            const paddingBottom = 20;

            const plotWidth = canvas.width - paddingLeft - paddingRight;
            const plotHeight = canvas.height - paddingTop - paddingBottom;

            // Grid Axes Accents
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(paddingLeft, paddingTop);
            ctx.lineTo(paddingLeft, canvas.height - paddingBottom);
            ctx.lineTo(canvas.width - paddingRight, canvas.height - paddingBottom);
            ctx.stroke();

            // Coordinate Mappers
            function getX(timeSecs) {
                return paddingLeft + (timeSecs / maxCumulativeTime) * plotWidth;
            }
            function getY(distMeters) {
                return (canvas.height - paddingBottom) - (distMeters / maxCumulativeDist) * plotHeight;
            }

            // Draw Step Lines
            let curTime = 0;
            let curDist = 0;

            timeline.forEach(step => {
                const startTime = curTime;
                const startDist = curDist;
                
                curTime += step.duration;
                curDist += step.dist;

                ctx.lineWidth = 3;
                if (step.type === 'work') {
                    ctx.strokeStyle = '#ef4444'; // Red for Work
                } else if (step.type === 'rest') {
                    ctx.strokeStyle = '#3b82f6'; // Blue for Rest
                } else {
                    ctx.strokeStyle = '#64748b'; // Slate for Warmup/Cooldown
                }

                ctx.beginPath();
                ctx.moveTo(getX(startTime), getY(startDist));
                ctx.lineTo(getX(curTime), getY(curDist));
                ctx.stroke();
            });

            // Live Pointer Marker Tracking Location Line
            if (activeTimeElapsed > 0) {
                const pointerX = getX(activeTimeElapsed);
                ctx.strokeStyle = '#f59e0b'; // Amber tracker line
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 3]);
                ctx.beginPath();
                ctx.moveTo(pointerX, paddingTop);
                ctx.lineTo(pointerX, canvas.height - paddingBottom);
                ctx.stroke();
                ctx.setLineDash([]);

                // Tracker Knob
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.arc(pointerX, canvas.height - paddingBottom, 4, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        function clockEngineTick() {
            if (!isRunning) return;

            const elapsedSeconds = (Date.now() - segmentStartTimeStamp) / 1000;
            const timeLeft = Math.max(0, currentSegmentDuration - elapsedSeconds);
            const ceilingSeconds = Math.ceil(timeLeft);

            if (ceilingSeconds !== lastReportedSecond) {
                lastReportedSecond = ceilingSeconds;
                
                // Audio Cadence Sequence Strategy Injection
                if (ceilingSeconds === 3) {
                    beep(880, 0.12, true); // Loud short beep
                } else if (ceilingSeconds === 2) {
                    beep(880, 0.12, true); // Loud short beep
                } else if (ceilingSeconds === 1) {
                    beep(1100, 0.50, true); // Distinct, long finish finish marker beeeep
                }
                
                updateUIElements(ceilingSeconds, timeLeft);
            }

            if (elapsedSeconds >= currentSegmentDuration) {
                advanceStateNode();
            } else {
                updateProgressBar(timeLeft);
                animationFrameId = requestAnimationFrame(clockEngineTick);
            }
        }

        function getCumulativeElapsedBeforeActiveIndex() {
            let total = 0;
            for(let i = 0; i < activeIndex; i++) {
                total += timeline[i].duration;
            }
            return total;
        }

        function updateUIElements(integerSecondsLeft, exactTimeLeft) {
            if (!timeline[activeIndex]) return;
            const current = timeline[activeIndex];
            const header = document.getElementById('timerHeader');
            const phaseLabel = document.getElementById('currentPhaseLabel');
            const counter = document.getElementById('stepCounter');
            const countdownDisplay = document.getElementById('mainCountdown');
            const targetAlert = document.getElementById('targetSplitAlert');
            const nextUpLabel = document.getElementById('nextUpLabel');

            const elapsedBeforeSegment = getCumulativeElapsedBeforeActiveIndex();
            const segmentElapsed = currentSegmentDuration - exactTimeLeft;
            const globalElapsed = Math.min(totalWorkoutDuration, elapsedBeforeSegment + segmentElapsed);

            document.getElementById('workoutElapsedDisplay').innerText = formatHMS(globalElapsed);
            document.getElementById('workoutTotalDisplay').innerText = formatHMS(totalWorkoutDuration);

            // Re-render Profile Map Pointer Position coordinates dynamically
            drawWorkoutProfileChart(globalElapsed);

            header.className = "px-5 py-4 flex justify-between items-center";
            if(current.type === 'work') {
                header.classList.add('bg-red-600', 'interval-active-work');
                phaseLabel.innerText = "🔥 HARD INTERVAL";
            } else if(current.type === 'rest') {
                header.classList.add('bg-blue-600');
                phaseLabel.innerText = "🌀 RECOVERY"; 
            } else {
                header.classList.add('bg-slate-700');
                phaseLabel.innerText = current.type.toUpperCase();
            }

            counter.innerText = "Step " + (activeIndex + 1) + "/" + timeline.length;
            countdownDisplay.innerText = formatMMSS(integerSecondsLeft);
            targetAlert.innerText = current.info;

            document.getElementById('backBtn').disabled = (activeIndex === 0);
            if (activeIndex === 0) {
                document.getElementById('backBtn').classList.add('opacity-40', 'cursor-not-allowed');
            } else {
                document.getElementById('backBtn').classList.remove('opacity-40', 'cursor-not-allowed');
            }

            if (activeIndex + 1 < timeline.length) {
                const nextNode = timeline[activeIndex + 1];
                nextUpLabel.innerText = nextNode.label + " (" + formatMMSS(nextNode.duration) + ")";
            } else {
                nextUpLabel.innerText = "Done! Workout Complete.";
            }
        }

        function updateProgressBar(exactTimeLeft) {
            const progressBar = document.getElementById('progressBar');
            const percentage = ((currentSegmentDuration - exactTimeLeft) / currentSegmentDuration) * 100;
            progressBar.style.width = percentage + "%";
        }

        function advanceStateNode() {
            let elapsedSeconds = (Date.now() - segmentStartTimeStamp) / 1000;
            
            while (activeIndex < timeline.length && elapsedSeconds >= currentSegmentDuration) {
                elapsedSeconds -= currentSegmentDuration;
                activeIndex++;
                if (activeIndex < timeline.length) {
                    currentSegmentDuration = timeline[activeIndex].duration;
                }
            }

            executeSegmentTransition(currentSegmentDuration - elapsedSeconds);
        }

        function forceManualSkipNode() {

                segmentStartTimeStamp = Date.now() - ((currentSegmentDuration - baseRemaining) * 1000);
                pauseRemainingSeconds = baseRemaining;

                speak("Next up: " + timeline[activeIndex].label);
                
                if (isRunning) {
                    setPlayPauseButtonUI(true);
                    animationFrameId = requestAnimationFrame(clockEngineTick);
                } else {
